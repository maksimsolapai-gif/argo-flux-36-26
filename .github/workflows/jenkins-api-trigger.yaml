name: Remote Jenkins Trigger via Smee.io

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Имя пользователя для проверки в /etc/passwd'
        required: true
        default: 'root'

jobs:
  check-user:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Job through Webhook Proxy
        run: |
          # 1. Запрашиваем Crumb защиты через прокси smee.io
          # Smee пробросит этот запрос на http://jenkins:8080/crumbIssuer/api/json
          echo "Получаем CSRF Crumb..."
          CRUMB_DATA=$(curl -s -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            --cookie-jar cookies.txt \
            "${{ secrets.SMEE_URL }}/crumbIssuer/api/json")
          
          CRUMB=$(echo "$CRUMB_DATA" | jq -r '.crumb')
          HEADER=$(echo "$CRUMB_DATA" | jq -r '.crumbRequestField')
          
          echo "Crumb успешно получен."

          # 2. Отправляем запрос на запуск сборки с параметром
          # Smee пробросит это на http://jenkins:8080/job/check-user-profile/buildWithParameters
          echo "Запускаем задачу в Jenkins для пользователя: ${{ github.event.inputs.username }}"
          
          curl -X POST -u "${{ secrets.JENKINS_USER }}:${{ secrets.JENKINS_TOKEN }}" \
            --cookie cookies.txt \
            -H "${HEADER}: ${CRUMB}" \
            "${{ secrets.SMEE_URL }}/job/check-user-profile/buildWithParameters?USER_NAME=${{ github.event.inputs.username }}"
            
          echo "Запрос отправлен на Smee Proxy. Проверьте историю сборок в Jenkins!"
