name: Remote Jenkins Trigger via Smee.io

on:
  workflow_dispatch:
    inputs:
      username:
        description: 'Имя пользователя для проверки в /etc/passwd'
        required: true
        default: 'root'

jobs:
  check-user:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Jenkins Job through Webhook Proxy
        run: |
          JENKINS_USER="${{ secrets.JENKINS_USER }}"
          JENKINS_TOKEN="${{ secrets.JENKINS_TOKEN }}"
          SMEE_URL="${{ secrets.SMEE_URL }}"
          CHECK_USER="${{ github.event.inputs.username }}"

          echo "Шаг 1: Запрашиваем CSRF Crumb через Smee.io..."
          
          # Делаем запрос и сохраняем сырой ответ в файл response.txt
          curl -s -X GET -u "$JENKINS_USER:$JENKINS_TOKEN" \
            --cookie-jar cookies.txt \
            "$SMEE_URL/crumbIssuer/api/json" > response.txt
          
          echo "=== Полученный ответ от сервера ==="
          cat response.txt
          echo -e "\n=================================="

          # Проверяем, содержит ли ответ ошибку Smee или HTML-код
          if grep -q "html" response.txt || grep -q "bad gateway" response.txt; then
             echo "КРИТИЧЕСКАЯ ОШИБКА: Smee.io не смог связаться с вашим Jenkins-сервером!"
             echo "Проверьте, запущен ли smee-client внутри вашего Kubernetes-кластера."
             exit 1
          fi

          # Если ответ корректный, парсим Crumb
          CRUMB=$(jq -r '.crumb // empty' response.txt)
          HEADER=$(jq -r '.crumbRequestField // empty' response.txt)

          if [ -z "$CRUMB" ]; then
             echo "ОШИБКА: Не удалось извлечь Crumb из ответа. Проверьте учетные данные Jenkins."
             exit 1
          fi

          echo "Crumb успешно получен: $CRUMB"

          echo "Шаг 2: Запускаем задачу в Jenkins для пользователя: $CHECK_USER"
          curl -X POST -u "$JENKINS_USER:$JENKINS_TOKEN" \
            --cookie cookies.txt \
            -H "${HEADER}: ${CRUMB}" \
            "$SMEE_URL/job/check-user-profile/buildWithParameters?USER_NAME=$CHECK_USER"
            
          echo "Запрос отправлен."
