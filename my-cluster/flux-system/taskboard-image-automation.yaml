apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: taskboard-image-repo
  namespace: flux-system
spec:
  image: ghcr.io/maksimsolapai-gif/jenkins-docker-k8s-pipeline
  interval: 1m0s
  secretRef:
    name: ghcr-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: taskboard-image-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: taskboard-image-repo
  policy:
    numerical:
      order: asc
  filterTags:
    pattern: '^gh-(?P<num>[0-9]+)$'
    extract: '$num'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: taskboard-git-automator
  namespace: flux-system
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-taskboard-repo
  # ИСПРАВЛЕНО: secretRef перенесен внутрь секции git в соответствии со спецификацией v1 API
  git:
    checkout:
      ref:
        branch: main
      # ТОКЕН ПЕРЕДАЕТСЯ СТРОГО СЮДА!
      secretRef:
        name: ghcr-secret
    commit:
      author:
        email: fluxcdbot@://github.com
        name: fluxcdbot
      messageTemplate: "chore(gitops): auto-update container images to latest stable build"
  update:
    path: ./k8s/manifests
