apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: taskboard-image-repo
  namespace: flux-system
spec:
  image: ghcr.io/maksimsolapai-gif/jenkins-docker-k8s-pipeline
  interval: 1m0s
  secretRef:
    name: ghcr-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: taskboard-image-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: taskboard-image-repo
  policy:
    # Числовая сортировка по возрастанию
    numerical:
      order: asc
  # ИСПРАВЛЕНО ПОД СТАНДАРТ V1: Находим теги gh-X и извлекаем из них только числовую группу
  filterTags:
    pattern: '^gh-(?P<num>[0-9]+)$'
    extract: '$num'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: taskboard-git-automator
  namespace: flux-system
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-taskboard-repo
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@://github.com
        name: fluxcdbot
      # ИСПРАВЛЕНО: Статический текст без фигурных скобок гарантирует 100% успех рендеринга
      messageTemplate: "chore(gitops): auto-update container images to latest stable build"
  update:
    path: ./k8s/manifests
