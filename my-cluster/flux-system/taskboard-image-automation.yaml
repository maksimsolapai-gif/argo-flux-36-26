apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: taskboard-image-repo
  namespace: flux-system
spec:
  image: ghcr.io/maksimsolapai-gif/jenkins-docker-k8s-pipeline
  interval: 1m0s
  secretRef:
    name: ghcr-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: taskboard-image-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: taskboard-image-repo
  policy:
    # Flux будет сканировать только чистые числа и выбирать максимальное по возрастанию (13, 14, 15...)
    numerical:
      order: asc

---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: taskboard-git-automator
  namespace: flux-system
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-taskboard-repo
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@users.noreply.github.com
        name: fluxcdbot
      messageTemplate: 'chore(gitops): auto-update image tag to {{ .SelectedTarget.Tag }}'
  update:
    path: ./k8s/manifests
