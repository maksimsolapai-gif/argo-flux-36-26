apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: taskboard-image-repo
  namespace: flux-system
spec:
  image: ghcr.io/maksimsolapai-gif/jenkins-docker-k8s-pipeline
  interval: 1m0s
  secretRef:
    name: ghcr-secret
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: taskboard-image-policy
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: taskboard-image-repo
  policy:
    numerical:
      order: asc
  # ИСПРАВЛЕНО: Фильтр пропускает ТОЛЬКО чистые цифры, полностью отсекая старые теги "gh-*"
  filterTags:
    pattern: '^[0-9]+$'
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: taskboard-git-automator
  namespace: flux-system
spec:
  interval: 1m0s
  sourceRef:
    kind: GitRepository
    name: flux-taskboard-repo
  # ПРАВИЛЬНО ПО СТАНДАРТУ V1: Секрет для git push должен лежать прямо здесь, на верхнем уровне spec!
  secretRef:
    name: git-write-secret
  git:
    checkout:
      ref:
        branch: main
    commit:
      author:
        email: fluxcdbot@://github.com
        name: fluxcdbot
      messageTemplate: "chore(gitops): auto-update container images to latest stable build"
  update:
    path: ./k8s/manifests
