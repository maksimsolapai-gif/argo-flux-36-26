---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kps-elk       # Новое уникальное имя релиза
  namespace: elk      # Целевое пространство имен
spec:
  interval: 10m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "92.3.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: monitoring # Ссылка на репозиторий чартов остается прежней
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
  values:
    # Задание 1: Описание правила алерта для CPU (адаптировано под namespace elk)
    additionalPrometheusRulesMap:
      custom-cpu-alerts-elk:
        groups:
          - name: custom-pod-rules-elk
            rules:
              - alert: HighPodCpuLoad
                expr: sum(rate(container_cpu_usage_seconds_total{namespace="elk", container!=""}[5m])) by (pod, namespace) > 0.8
                for: 2m
                labels:
                  severity: warning
                annotations:
                  summary: "Высокая нагрузка CPU на поде {{ $labels.pod }} [ELK]"
                  description: "Под {{ $labels.pod }} в namespace {{ $labels.namespace }} потребляет более 0.8 ядра."

    # Настройка Alertmanager в пространстве elk
    alertmanager:
      enabled: true
      alertmanagerSpec:
        configSelector: {}
        configSecret: alertmanager-kps-generated # Возьмет созданный нами секрет из namespace elk
        storage:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-client
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 2Gi

    prometheus:
      prometheusSpec:
        retention: 7d
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: nfs-client
              accessModes: ["ReadWriteOnce"]
              resources:
                requests:
                  storage: 10Gi
        resources:
          requests: {cpu: 200m, memory: 512Mi}
          limits: {cpu: "1", memory: 2Gi}
    
    kubeProxy:
      enabled: false
      
    grafana:
      enabled: true
      adminPassword: admin
      persistence:
        enabled: true
        storageClassName: nfs-client
        size: 2Gi
      sidecar:
        dashboards:
          enabled: true
          label: grafana_dashboard
          labelValue: "1"
          searchNamespace: elk # Сканировать дашборды теперь внутри namespace elk
          folderAnnotation: grafana_folder
          provider:
            foldersFromFilesStructure: true
      additionalDataSources:
        - name: Loki
          type: loki
          uid: loki
          access: proxy
          url: http://cluster.local
          jsonData:
            maxLines: 1000
